<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CS2 Predictor - Fantasy</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }


        

        /* =========================
           MAIN PAGE
        ========================= */

        .container {
            max-width: 1400px;

            margin: 60px auto;

            padding: 20px;

            text-align: center;
        }

        h1 {
            font-size: 36px;

            margin-bottom: 60px;
        }


        /* =========================
           TEAMS
        ========================= */

        .teams {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 40px;
        }

        .team {
            flex: 1;
        }

        .team h2 {
            margin-bottom: 25px;
        }


        /* =========================
           PLAYER SLOTS
        ========================= */

        .slots {
            display: flex;

            justify-content: center;

            gap: 12px;
        }

        .slot {
            position: relative;

            width: 140px;
            height: 180px;

            background: #1b1b1b;

            border: 2px dashed #555;

            border-radius: 8px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition: 0.15s;
        }

        .slot:hover {
            background: #222;

            border-color: white;
        }


        /* EMPTY SLOT */

        .slot.empty {
            color: #777;

            font-size: 40px;
        }

        .slot.empty span {
            display: block;

            font-size: 14px;

            margin-top: 5px;
        }


        /* FILLED SLOT */

        .slot img {
            width: 105px;
            height: 105px;

            object-fit: contain;
        }

        .player-name {
            margin-top: 10px;

            font-size: 15px;

            font-weight: bold;
        }


        /* =========================
           REMOVE PLAYER BUTTON
        ========================= */

        .remove-player {
            position: absolute;

            top: 6px;
            right: 8px;

            width: 24px;
            height: 24px;

            border: none;

            border-radius: 50%;

            background: #444;

            color: white;

            font-size: 17px;

            line-height: 20px;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 2;
        }

        .remove-player:hover {
            background: #777;
        }


        /* =========================
           VS
        ========================= */

        .vs {
            font-size: 35px;

            font-weight: bold;

            padding-top: 45px;

            flex-shrink: 0;
        }


        /* =========================
           CONFIRM BUTTON
        ========================= */

        .confirm-container {
            margin-top: 60px;
        }

        .confirm {
            padding: 15px 45px;

            border: none;

            border-radius: 6px;

            background: white;

            color: black;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .confirm:hover {
            background: #ddd;
        }

        .confirm:disabled {
            background: #444;

            color: #777;

            cursor: not-allowed;
        }


        /* =========================
           PLAYER PICKER OVERLAY
        ========================= */

        .player-picker {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.85);

            z-index: 100;
        }


        .picker-content {
            width: 90%;
            max-width: 1100px;

            height: 80%;

            margin: 5% auto;

            padding: 30px;

            background: #181818;

            border-radius: 10px;

            overflow-y: auto;
        }


        /* =========================
           PICKER HEADER
        ========================= */

        .picker-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }

        .picker-header h2 {
            margin: 0;
        }

        .close {
            font-size: 32px;

            color: #aaa;

            cursor: pointer;
        }

        .close:hover {
            color: white;
        }


        /* =========================
           SEARCH
        ========================= */

        #playerSearch {
            width: 100%;

            padding: 14px;

            margin-bottom: 25px;

            background: #222;

            border: 1px solid #444;

            border-radius: 6px;

            color: white;

            font-size: 16px;

            outline: none;
        }

        #playerSearch:focus {
            border-color: white;
        }

        #playerSearch::placeholder {
            color: #777;
        }


        /* =========================
           PLAYER LIST
        ========================= */

        .players {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(140px, 1fr));

            gap: 15px;
        }

        .player {
            background: #222;

            border: 2px solid transparent;

            border-radius: 8px;

            padding: 15px;

            text-align: center;

            cursor: pointer;

            transition: 0.15s;
        }

        .player:hover {
            background: #292929;

            border-color: white;
        }

        .player.disabled {
            opacity: 0.2;

            cursor: not-allowed;
        }

        .player img {
            width: 90px;
            height: 90px;

            object-fit: contain;
        }

        .player p {
            margin: 8px 0 0;

            font-weight: bold;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 1100px) {

            .teams {
                flex-direction: column;
            }

            .vs {
                padding-top: 0;
            }

            .slots {
                flex-wrap: wrap;
            }

        }

    </style>

</head>


<body>


   



    <!-- =========================
         MAIN FANTASY PAGE
    ========================= -->

    <div class="container">

        <h1>
            Fantasy
        </h1>


        <div class="teams">


            <!-- =====================
                 YOUR TEAM
            ====================== -->

            <div class="team">

                <h2>
                    Your Team
                </h2>


                <div class="slots">


                    <div
                        class="slot empty"
                        data-team="0"
                        data-slot="0"
                        onclick="openPicker(0, 0)"
                    >
                        +
                        <span>
                            Player
                        </span>
                    </div>


                    <div
                        class="slot empty"
                        data-team="0"
                        data-slot="1"
                        onclick="openPicker(0, 1)"
                    >
                        +
                        <span>
                            Player
                        </span>
                    </div>


                    <div
                        class="slot empty"
                        data-team="0"
                        data-slot="2"
                        onclick="openPicker(0, 2)"
                    >
                        +
                        <span>
                            Player
                        </span>
                    </div>


                    <div
                        class="slot empty"
                        data-team="0"
                        data-slot="3"
                        onclick="openPicker(0, 3)"
                    >
                        +
                        <span>
                            Player
                        </span>
                    </div>


                    <div
                        class="slot empty"
                        data-team="0"
                        data-slot="4"
                        onclick="openPicker(0, 4)"
                    >
                        +
                        <span>
                            Player
                        </span>
                    </div>


                </div>

            </div>



            <!-- =====================
                 VS
            ====================== -->

            <div class="vs">
                VS
            </div>



            <!-- =====================
                 OPPONENT
            ====================== -->

            <div class="team">

                <h2>
                    Opponent
                </h2>


                <div class="slots">


                    <div
                        class="slot empty"
                        data-team="1"
                        data-slot="0"
                        onclick="openPicker(1, 0)"
                    >
                        +
                        <span>
                            Player
                        </span>
                    </div>


                    <div
                        class="slot empty"
                        data-team="1"
                        data-slot="1"
                        onclick="openPicker(1, 1)"
                    >
                        +
                        <span>
                            Player
                        </span>
                    </div>


                    <div
                        class="slot empty"
                        data-team="1"
                        data-slot="2"
                        onclick="openPicker(1, 2)"
                    >
                        +
                        <span>
                            Player
                        </span>
                    </div>


                    <div
                        class="slot empty"
                        data-team="1"
                        data-slot="3"
                        onclick="openPicker(1, 3)"
                    >
                        +
                        <span>
                            Player
                        </span>
                    </div>


                    <div
                        class="slot empty"
                        data-team="1"
                        data-slot="4"
                        onclick="openPicker(1, 4)"
                    >
                        +
                        <span>
                            Player
                        </span>
                    </div>


                </div>

            </div>


        </div>



        <!-- =========================
            CONFIRM
        ========================= -->

        <div class="confirm-container">

            <form method="POST" action="/fantasy-results/" id="fantasyForm">
                {% csrf_token %}

                <div id="selectedPlayers"></div>

                <button
                    type="button"
                    class="confirm"
                    id="confirmButton"
                    onclick="confirmTeams()"
                    disabled
                >
                    Confirm Lineups
                </button>
            </form>

        </div>


    </div>



    <!-- =========================
         PLAYER PICKER
    ========================= -->

    <div
        class="player-picker"
        id="playerPicker"
    >

        <div class="picker-content">


            <div class="picker-header">

                <h2>
                    Choose Player
                </h2>

                <span
                    class="close"
                    onclick="closePicker()"
                >
                    &times;
                </span>

            </div>


            <!-- SEARCH -->

            <input
                type="text"
                id="playerSearch"
                placeholder="Search player..."
                oninput="searchPlayers()"
            >


            <!-- PLAYERS -->

            <div class="players">


                {% for player in players %}

                    <div
                        class="player"
                        data-player-id="{{ player.hltv_id }}"
                        data-player-name="{{ player.name|lower }}"
                        onclick="selectPlayer('{{ player.hltv_id }}')"
                    >

                        {% if player.image_url %}

                            <img
                                src="{{ player.image_url }}"
                                alt="{{ player.name }}"
                            >

                        {% endif %}

                        <p>
                            {{ player.name }}
                        </p>

                    </div>

                {% endfor %}


            </div>


        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        /*
         * Two teams.
         *
         * Each team has five slots.
         */

        let teams = [

            [null, null, null, null, null],

            [null, null, null, null, null]

        ];


        /*
         * Slot currently being filled.
         */

        let currentTeam = null;

        let currentSlot = null;



        /*
         * Player information from Django.
         */

        const players = {

            {% for player in players %}

                "{{ player.hltv_id }}": {

                    id: "{{ player.hltv_id }}",

                    name: "{{ player.name|escapejs }}",

                    image: "{{ player.image_url|escapejs }}"

                },

            {% endfor %}

        };



        /*
         * Open player picker.
         */

        function openPicker(team, slot) {

            currentTeam = team;

            currentSlot = slot;


            document
                .getElementById("playerPicker")
                .style.display = "block";


            /*
             * Clear search.
             */

            document
                .getElementById("playerSearch")
                .value = "";


            searchPlayers();

            updatePlayerAvailability();

        }



        /*
         * Close player picker.
         */

        function closePicker() {

            document
                .getElementById("playerPicker")
                .style.display = "none";


            currentTeam = null;

            currentSlot = null;

        }



        /*
         * Select player.
         */

        function selectPlayer(playerId) {


            /*
             * Don't allow a player already
             * selected elsewhere.
             */

            if (isPlayerSelected(playerId)) {


                /*
                 * If they're already in the
                 * current slot, remove them.
                 */

                if (
                    teams[currentTeam][currentSlot]
                    === playerId
                ) {

                    teams[currentTeam][currentSlot]
                        = null;


                    updateSlots();

                    closePicker();

                }

                return;

            }



            /*
             * Put player into selected slot.
             */

            teams[currentTeam][currentSlot]
                = playerId;


            updateSlots();

            closePicker();

        }



        /*
         * Check if player is already selected.
         */

        function isPlayerSelected(playerId) {

            for (let team of teams) {

                if (team.includes(playerId)) {

                    return true;

                }

            }

            return false;

        }



        /*
         * Update player availability.
         */

        function updatePlayerAvailability() {

            const playerElements =
                document.querySelectorAll(".player");


            playerElements.forEach(element => {

                const playerId =
                    element.dataset.playerId;


                element.classList.remove("disabled");


                /*
                 * Disable players already
                 * selected elsewhere.
                 */

                if (

                    isPlayerSelected(playerId)

                    &&

                    teams[currentTeam][currentSlot]
                        !== playerId

                ) {

                    element.classList.add("disabled");

                }

            });

        }



        /*
         * Search players.
         */

        function searchPlayers() {

            const search =

                document
                    .getElementById("playerSearch")
                    .value
                    .toLowerCase()
                    .trim();


            const playerElements =
                document.querySelectorAll(".player");


            playerElements.forEach(player => {

                const name =
                    player.dataset.playerName;


                if (name.includes(search)) {

                    player.style.display = "";

                }

                else {

                    player.style.display = "none";

                }

            });

        }



        /*
         * Update the ten slots.
         */

        function updateSlots() {

            const slots =
                document.querySelectorAll(".slot");


            slots.forEach(slot => {

                const team =
                    parseInt(slot.dataset.team);

                const position =
                    parseInt(slot.dataset.slot);

                const playerId =
                    teams[team][position];


                /*
                 * EMPTY SLOT
                 */

                if (playerId === null) {

                    slot.classList.add("empty");

                    slot.innerHTML = `

                        +

                        <span>
                            Player
                        </span>

                    `;

                    return;

                }


                /*
                 * FILLED SLOT
                 */

                const player =
                    players[playerId];


                slot.classList.remove("empty");


                slot.innerHTML = `

                    <button
                        class="remove-player"
                        onclick="removePlayer(
                            event,
                            ${team},
                            ${position}
                        )"
                    >
                        ×
                    </button>

                    <img
                        src="${player.image}"
                        alt="${player.name}"
                    >

                    <div class="player-name">
                        ${player.name}
                    </div>

                `;

            });


            updateConfirmButton();

        }



        /*
         * Remove player.
         */

        function removePlayer(event, team, slot) {

            /*
             * Stop the click from opening
             * the player picker.
             */

            event.stopPropagation();


            /*
             * Remove the player.
             */

            teams[team][slot] = null;


            /*
             * Update page.
             */

            updateSlots();

        }



        /*
         * Enable confirm only when both
         * teams have five players.
         */

        function updateConfirmButton() {

            const complete =

                teams[0].every(
                    player => player !== null
                )

                &&

                teams[1].every(
                    player => player !== null
                );


            document
                .getElementById("confirmButton")
                .disabled = !complete;

        }



        /*
         * Confirm teams.
         */

        function confirmTeams() {

    if (
        teams[0].includes(null) ||
        teams[1].includes(null)
    ) {
        return;
    }


    const container =
        document.getElementById("selectedPlayers");


    container.innerHTML = "";


    /*
     * Add Team 1 players
     */

    teams[0].forEach(playerId => {

            const input =
                document.createElement("input");

            input.type = "hidden";

            input.name = "team_1";

            input.value = playerId;

            container.appendChild(input);

        });


        /*
        * Add Team 2 players
        */

        teams[1].forEach(playerId => {

            const input =
                document.createElement("input");

            input.type = "hidden";

            input.name = "team_2";

            input.value = playerId;

            container.appendChild(input);

        });


        /*
        * Submit the form
        */

        document
            .getElementById("fantasyForm")
            .submit();

    }



        /*
         * Close picker when clicking
         * outside the picker content.
         */

        document
            .getElementById("playerPicker")
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target === this
                    ) {

                        closePicker();

                    }

                }
            );


    </script>


</body>

</html>
